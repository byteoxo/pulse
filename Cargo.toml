[package]
name = "pulse-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A terminal dashboard for network speed, latency, and jitter"
license = "MIT"
default-run = "pulse"

[lib]
name = "pulse"

[[bin]]
name = "pulse"
path = "src/main.rs"

[[bin]]
name = "pulse-server"
path = "src/bin/server.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
crossterm = { version = "0.29", features = ["event-stream"] }
directories = "6"
futures-util = "0.3"
ratatui = "0.30"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = "thin"
strip = true
